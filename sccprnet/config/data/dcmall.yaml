name: dcmall
bs: 1
ssl: 0
n_ssl: 16
split: 0
bands: 191
transform: 2
params:
  batch_size: ${data.bs}
  factory:
    name: DCMall
    params:
      noise: ${noise}
      seed: ${seed}
      # Replace with the absolute DCMall data directory on the server if needed.
      path_data: data
      ssl: ${data.ssl}
      split: ${data.split}
  train_params:
    patch_size: 64
    stride: [16, 8, 8]
    subsample: [1, 2, 4]
    crop_center: null
    repeat: 1
    transform: ${data.transform}
  # Eight CPU workers keep the GPU supplied while it trains batch=4 patches.
  num_workers: 8
  bands: ${data.bands}
